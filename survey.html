<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What makes you buy bubble tea? – Group 5 survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --film:#F2F4EE;   /* page: pale sealing-film green */
  --cup:#FFFFFF;
  --leaf:#2F5D3A;   /* oolong leaf */
  --amber:#C98B2B;  /* black tea */
  --pearl:#2A1F1A;  /* tapioca: text and selections */
  --muted:#5F6457;
  --rule:#D5DBCC;
  --err:#B42318;
  --font:"Bricolage Grotesque","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--film);color:var(--pearl);font:400 17px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2{margin:0;font-weight:700;letter-spacing:-.015em}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.small{font-size:14px;color:var(--muted)}

/* progress bar under the section title */
.sec-head.with-bar{border-bottom:0}
.progress{height:8px;overflow:hidden;border-radius:4px;background:var(--rule)}
.progress-fill{height:100%;background:var(--amber);border-radius:4px;transition:width .6s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.progress-fill{transition:none}}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto;padding:14px 20px 0}
.tb-title{font-size:15px;font-weight:500}
.modes{display:flex;gap:2px;padding:3px;border:1px solid var(--rule);border-radius:999px;background:var(--cup)}
.mode{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.mode[aria-pressed="true"]{background:var(--pearl);color:#fff}

/* welcome */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:32px;align-items:center;padding:36px 0 40px}
.hero h1{font-size:clamp(42px,7.5vw,68px);line-height:.98;letter-spacing:-.035em;font-variation-settings:"opsz" 96}
.lead{font-size:19px;line-height:1.5;max-width:32em;margin:20px 0}
.facts{list-style:none;margin:0 0 28px;padding:0;display:grid;gap:6px}
.facts li{position:relative;padding-left:24px}
.facts li::before{content:"";position:absolute;left:2px;top:.45em;width:11px;height:11px;border-radius:50%;background:var(--pearl)}
.cup-hero{display:block;width:100%;max-width:250px;margin:0 auto}
@media(max-width:640px){.hero{grid-template-columns:1fr;gap:12px;padding-top:20px}.hero-cup{order:-1}.cup-hero{max-width:130px;margin:0}}
.staff{padding:32px 20px 48px}
.staff p{margin:12px 0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.langs{display:inline-flex}
.zh-sub{margin:12px 0 0;font-size:clamp(24px,4.2vw,34px);font-weight:500;color:var(--muted)}
.zh-line{display:block;font-size:.88em;color:var(--muted)}
.setup-label{margin:28px 0 12px;font-weight:500;text-align:center}
.langs-row{display:flex;justify-content:center}
.setup .mode{min-width:150px;padding:14px 28px;font-size:18px}
.setup .email,.staff .email{max-width:none;margin-top:28px}
.start-row{padding:0 0 64px;text-align:center}
.btn.huge{min-width:min(100%,340px);padding:20px 56px;font-size:23px}
.start-row .small{max-width:34em;margin:16px auto 0}
.email{display:grid;gap:6px;max-width:26em;margin:0 0 4px;font-weight:500}
.email-err{margin:6px 0 0;font-size:15px;font-weight:500;color:var(--err)}
.email-err:empty{display:none}
.email.bad .txt{border-color:var(--err)}

/* section header with the filling cup */
.sec-head{display:flex;align-items:flex-end;gap:16px;padding:22px 0 16px;border-bottom:2px solid var(--pearl)}
.cupmeter{flex:none;width:44px;height:60px}
.tea{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.tea{transition:none}}
.part{margin:0 0 4px;font-size:14px;color:var(--muted)}
.sec-head h2{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;font-size:clamp(26px,4.6vw,36px);line-height:1.1;font-variation-settings:"opsz" 48}
.sec-head .zh{font-size:.62em;font-weight:400;color:var(--muted)}
.hlogo{display:inline-flex}
.hlogo .logo{width:46px;border:1px solid var(--rule)}
.hlogo .logo.nologo{display:none}
.sec-intro{margin:14px 0 0;color:var(--muted)}

/* questions */
.q{padding:26px 0;border-bottom:1px solid var(--rule)}
.q-head{display:flex;gap:12px;align-items:baseline}
.q-num{flex:none;min-width:38px;font-size:14px;font-weight:700;color:var(--leaf)}
.q-text{font-size:19px;font-weight:500;line-height:1.35}
.q-hint,.q-body,.q-err{margin-left:50px}
.q-hint{margin-top:4px;margin-bottom:0;font-size:15px;color:var(--muted)}
.q-body{margin-top:14px}
.q-err{display:none;margin-top:12px;margin-bottom:0;font-size:15px;font-weight:500;color:var(--err)}
.q.err .q-err,.q.warn .q-err{display:block}
.q.err .q-num{color:var(--err)}
@media(max-width:560px){.q-hint,.q-body,.q-err{margin-left:0}}

/* options */
.opts{display:grid;gap:8px}
.opts.c2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.opts.h{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.opt{position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--rule);border-radius:12px;background:var(--cup);cursor:pointer;line-height:1.3}
.opts.h .opt{flex-direction:column;justify-content:center;gap:7px;padding:12px 8px;text-align:center;font-size:15px}
.opt input,.tile input,.gb input{position:absolute;opacity:0;pointer-events:none}
.mk{position:relative;flex:none;width:20px;height:20px;border:2px solid var(--pearl);border-radius:50%}
.opt.cb .mk{border-radius:5px}
.opt:hover{border-color:var(--pearl)}
.opt.on{background:var(--pearl);border-color:var(--pearl);color:#fff}
.opt.on .mk{border-color:#fff;background:#fff}
.opt.on .mk::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--pearl)}
.opt.cb.on .mk::after{inset:auto;left:5px;top:1px;width:6px;height:11px;border-radius:0;background:none;border:solid var(--pearl);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt:focus-within,.tile:focus-within,.gb:focus-within{outline:3px solid var(--amber);outline-offset:2px}
.other,.txt{width:100%;padding:11px 14px;border:1.5px solid var(--rule);border-radius:12px;background:var(--cup)}
.other{grid-column:1/-1}
.other:focus,.txt:focus{outline:3px solid var(--amber);outline-offset:1px;border-color:var(--pearl)}

/* logo tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
@media(max-width:600px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px 12px;border:1.5px solid var(--rule);border-radius:16px;background:var(--cup);cursor:pointer;text-align:center}
.tile:hover{border-color:var(--pearl)}
.tname{font-size:14px;line-height:1.3}
.tick{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:2px solid var(--rule);background:#fff}
.tile.on{border-color:var(--pearl);box-shadow:inset 0 0 0 2px var(--pearl)}
.tile.on .tick{background:var(--pearl);border-color:var(--pearl)}
.tile.on .tick::after{content:"";position:absolute;left:6px;top:3px;width:6px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.logo{display:grid;place-items:center;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:10px;background:#fff}
.logo img{max-width:88%;max-height:88%;object-fit:contain}
.logo .fb{display:none;padding:6px;font-size:20px;font-weight:700;line-height:1.2;text-align:center}
.logo .fb small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.logo.nologo img{display:none}
.logo.nologo .fb{display:block}

/* Likert grids: the answer buttons are pearls */
.legend{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;margin-bottom:4px;font-size:14px;color:var(--muted)}
.grow{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 0;border-top:1px dashed var(--rule)}
.glabel{flex:1;min-width:0;line-height:1.35}
.grow.miss .glabel{color:var(--err);font-weight:500}
.gbtns{display:flex;gap:6px;flex:none}
.gb{position:relative;display:grid;place-items:center;width:40px;height:40px;border:1.5px solid var(--rule);border-radius:50%;background:var(--cup);font-weight:500;cursor:pointer}
.gb:hover{border-color:var(--pearl)}
.gb.on{background:var(--pearl);border-color:var(--pearl);color:#fff}
@media(max-width:560px){.grow{flex-direction:column;align-items:stretch}.gbtns{justify-content:space-between}.gb{width:44px;height:44px}}

/* buttons, end screen */
.nav{display:flex;justify-content:space-between;gap:12px;padding:28px 0 64px}
.btn{border:1.5px solid var(--pearl);background:transparent;border-radius:999px;padding:11px 24px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--pearl);color:#fff}
.btn.primary:hover{background:var(--leaf);border-color:var(--leaf)}
.btn.big{padding:15px 32px;font-size:18px}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn:focus-visible,.mode:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.end{padding-top:56px;padding-bottom:64px;text-align:center}
.end .cupmeter{display:block;width:84px;height:116px;margin:0 auto 20px}
.end h1{font-size:clamp(36px,6vw,52px)}
.end .lead{margin-left:auto;margin-right:auto}

/* phones */
@media(max-width:560px){
  body{font-size:16px}
  .wrap{padding:0 16px}
  .topbar{flex-wrap:wrap;padding:10px 16px 0}
  .tb-title{font-size:14px}
  .mode{padding:6px 11px;font-size:13px}
  .lead{font-size:17px}
  .q{padding:20px 0}
  .q-text{font-size:17px}
  .opts.h{grid-template-columns:1fr}
  .opts.h .opt{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;text-align:left;font-size:inherit}
  .opts.c2{grid-template-columns:1fr}
  .nav{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--film);border-top:1px solid var(--rule)}
  .nav .btn{flex:1}
  .btn.big{width:100%}
  .end{padding-top:32px}
}
/* no sticky hover on touch screens */
@media(hover:none){.opt:hover,.tile:hover,.gb:hover{border-color:var(--rule)}.opt.on:hover,.tile.on:hover,.gb.on:hover{border-color:var(--pearl)}}

</style>
</head>

async function start() {
  const email = draftEmail.trim().toLowerCase();
  const fail = msg => {
    document.getElementById("email-l").classList.add("bad");
    document.getElementById("email-err").textContent = tr(msg);
    document.getElementById("email").focus();
  };
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("Please enter a valid email address.");
  if (STUDY.sheetUrl) {
    const btn = document.getElementById("next");
    btn.disabled = true; btn.textContent = tr("Checking…");
    let used = false;
    try { used = (await postSheet({ action: "check", email })).exists === true; }
    catch (e) { /* no connection: let them answer; the sheet rejects a repeated email on submit */ }
    if (!document.body.contains(btn)) return;   // left the page while waiting
    btn.disabled = false; btn.textContent = tr("Start the survey");
    if (used) return fail("This email has already been used to answer the survey.");
  }
  draftEmail = "";
  if (meta && !meta.done && meta.email === email) { meta.lang = lang; return renderSection(SECTIONS[0]); }
  A = {}; lastLevel = 0;
  meta = { id: Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase(),
           start: new Date().toISOString(), lang, email };
  renderSection(SECTIONS[0]);
}

  <div class="wrap">
    <header class="sec-head with-bar">${cupSVG(lastLevel)}<div><p class="part">${fmt("Part {p} of {n}", { p: sec.part, n: PARTS })}${sub}</p><h2>${title}</h2></div></header>
    <div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${Math.round(lastLevel * 100)}%"></div></div>
    ${sec.intro ? `<p class="sec-intro">${tr(sec.intro)}</p>` : ""}
    <div class="qs"></div>
    <nav class="nav"><button class="btn" id="back" type="button">${tr("Back")}</button><button class="btn primary" id="next" type="button">${tr("Next")}</button></nav>
  </div>`;
  const box = app.querySelector(".qs");
  sec.qs.forEach(q => box.appendChild(renderQ(q)));
  app.querySelector("#back").onclick = goBack;
  app.querySelector("#next").onclick = goNext;
  refresh();
  window.scrollTo(0, 0);
  fillCup(level);
  setProgress(level);
}

// slides the bar from the previous page's level to this one
function setProgress(level) {
  const bar = app.querySelector(".progress");
  if (!bar) return;
  const pct = Math.round(level * 100);
  bar.setAttribute("aria-valuenow", pct);
  bar.firstChild.getBoundingClientRect();
  requestAnimationFrame(() => { bar.firstChild.style.width = pct + "%"; });
}

function fillCup(level) {
  const t = app.querySelector(".cupmeter .tea");
  if (t) { t.getBoundingClientRect(); requestAnimationFrame(() => { t.style.transform = `scaleY(${level})`; }); }
  lastLevel = level;
}

function renderQ(q) {
  const c = document.createElement("div");
  c.className = "q"; c._q = q;
  const hint = q.hint ? tr(q.hint) : q.t === "multi" ? (q.max ? fmt("Choose up to {n}.", { n: q.max }) : tr("Choose all that apply.")) : "";
  c.innerHTML = `<div class="q-head"><span class="q-num">${q.id}</span><div class="q-text"></div></div>`
    + (hint ? `<p class="q-hint">${hint}</p>` : "")
    + `<div class="q-body"></div><p class="q-err" role="alert"></p>`;
  const body = c.querySelector(".q-body");
  if (q.t === "grid") body.appendChild(renderGrid(q, c));
  else body.appendChild(renderOpts(q, c));
  return c;
}

function renderOpts(q, c) {
  const multi = q.t === "multi", frag = document.createDocumentFragment();
  const tiles = document.createElement("div"); tiles.className = "tiles";
  const list = document.createElement("div"); list.className = "opts" + (q.h ? " h" : "") + (q.cols ? " c2" : "");
  if (q.tiles) frag.appendChild(tiles);
  frag.appendChild(list);
  q.opts.forEach(([code, label, other]) => {
    const brand = q.tiles ? BRANDS.find(b => b.id === code) : null;
    const lab = document.createElement("label");
    lab.className = brand ? "tile" : "opt" + (multi ? " cb" : "");
    lab.innerHTML = `<input type="${multi ? "checkbox" : "radio"}" name="${q.v}">` + (brand
      ? `${logoHTML(brand)}${SHOW_NAMES_UNDER_LOGOS ? `<span class="tname">${esc(brand.name)}<br>${brand.zh}</span>` : ""}<span class="tick"></span>`
      : `<span class="mk"></span><span>${tr(label)}</span>`);
    const inp = lab.querySelector("input");
    inp._code = code;
    inp.addEventListener("change", () => pick(q, c, code, inp));
    (brand ? tiles : list).appendChild(lab);
    if (other) {
      const t = document.createElement("input");
      t.type = "text"; t.className = "other"; t.placeholder = tr("Type the shop name"); t.hidden = true;
      t.setAttribute("aria-label", tr("Other shop name"));
      t.value = A[q.v + "_other"] || "";
      t.addEventListener("input", () => { A[q.v + "_other"] = t.value; c.classList.remove("err"); refresh(); });
      list.appendChild(t);
    }
  });
  return frag;
}

function pick(q, c, code, inp) {
  if (q.t === "single") A[q.v] = code;
  else {
    let arr = (A[q.v] || []).slice();
    if (inp.checked) {
      if (q.excl !== undefined && code === q.excl) arr = [code];
      else {
        arr = arr.filter(x => x !== q.excl);
        if (q.max && arr.length >= q.max) { inp.checked = false; note(c, fmt("You can choose up to {n}. Untick one first.", { n: q.max })); return; }
        arr.push(code);
      }
    } else arr = arr.filter(x => x !== code);
    A[q.v] = arr;
  }
  c.classList.remove("err");
  refresh();
}

function renderGrid(q, c) {
  const L = q.scale.labels.map(tr), g = document.createElement("div");
  g.innerHTML = `<div class="legend"><span>1 = ${L[0]}</span><span>5 = ${L[4]}</span></div>`;
  q.rows.forEach(([k, label]) => {
    const r = document.createElement("div");
    r.className = "grow"; r.dataset.k = k;
    r.innerHTML = `<div class="glabel" id="${q.v}_${k}_l">${tr(label)}</div><div class="gbtns" role="radiogroup" aria-labelledby="${q.v}_${k}_l"></div>`;
    const btns = r.querySelector(".gbtns");
    [1, 2, 3, 4, 5].forEach(code => {
      const lab = document.createElement("label");
      lab.className = "gb"; lab.title = `${code} = ${L[code - 1]}`;
      lab.innerHTML = `<input type="radio" name="${q.v}_${k}" aria-label="${code} ${L[code - 1]}"><span>${code}</span>`;
      const inp = lab.querySelector("input");
      inp._code = code; inp._row = k;
      inp.addEventListener("change", () => {
        A[q.v] = Object.assign({}, A[q.v], { [k]: code });
        r.classList.remove("miss");
        if (q.rows.every(([kk]) => A[q.v][kk] !== undefined)) c.classList.remove("err");
        refresh();
      });
      btns.appendChild(lab);
    });
    g.appendChild(r);
  });
  return g;
}

function note(c, msg) {
  c.querySelector(".q-err").textContent = msg;
  c.classList.add("warn");
  clearTimeout(c._t);
  c._t = setTimeout(() => c.classList.remove("warn"), 3000);
}

/* show/hide questions, sync inputs */
function refresh() {
  app.querySelectorAll(".q").forEach(c => {
    const q = c._q, vis = shown(q);
    if (!vis) { delete A[q.v]; delete A[q.v + "_other"]; }
    c.hidden = !vis;
    c.querySelector(".q-text").innerHTML = tr(val(q.text));
    c.querySelectorAll("input").forEach(inp => {
      if (inp._code === undefined) return;
      if (inp._row !== undefined) inp.checked = (A[q.v] || {})[inp._row] === inp._code;
      else if (q.t === "single") inp.checked = A[q.v] === inp._code;
      else inp.checked = (A[q.v] || []).includes(inp._code);
      inp.parentNode.classList.toggle("on", inp.checked);
    });
    const ot = c.querySelector(".other");
    if (ot) {
      const oc = otherCode(q), sel = q.t === "single" ? A[q.v] === oc : (A[q.v] || []).includes(oc);
      ot.hidden = !sel;
      if (!sel && ot.value) { ot.value = ""; delete A[q.v + "_other"]; }
    }
  });
  const nb = app.querySelector("#next");
  if (nb) nb.textContent = !SECTIONS.slice(SECTIONS.indexOf(cur) + 1).some(shown) ? tr("Finish") : tr("Next");
}

function validate() {
  let first = null;
  app.querySelectorAll(".q").forEach(c => {
    const q = c._q;
    if (c.hidden || q.optional) return;
    const v = A[q.v];
    let ok = true, msg = tr("Please answer this question.");
    if (q.t === "single") ok = v !== undefined;
    else if (q.t === "multi") ok = Array.isArray(v) && v.length > 0;
    else if (q.t === "grid") {
      const miss = q.rows.filter(([k]) => !v || v[k] === undefined).map(([k]) => k);
      c.querySelectorAll(".grow").forEach(r => r.classList.toggle("miss", miss.includes(r.dataset.k)));
      ok = !miss.length; msg = tr("Please answer every statement.");
    }
    const oc = otherCode(q);
    if (ok && oc !== undefined && (v === oc || (Array.isArray(v) && v.includes(oc))) && !(A[q.v + "_other"] || "").trim()) { ok = false; msg = tr("Please type the shop name."); }
    c.classList.toggle("err", !ok);
    if (!ok) { c.querySelector(".q-err").textContent = msg; if (!first) first = c; }
  });
  if (first) { first.scrollIntoView({ behavior: motionOK() ? "smooth" : "auto", block: "center" }); return false; }
  return true;
}

function goNext() {
  if (!validate()) return;
  const nx = SECTIONS.slice(SECTIONS.indexOf(cur) + 1).find(shown);
  nx ? renderSection(nx) : finish();
}

function goBack() {
  const pv = SECTIONS.slice(0, SECTIONS.indexOf(cur)).reverse().find(shown);
  if (pv) return renderSection(pv);
  draftEmail = meta.email;   // going back keeps the typed email
  renderSetup();
}

/* keep only answers to questions the respondent actually saw */
function prune() {
  const keep = {};
  for (const s of SECTIONS) {
    if (!shown(s)) continue;
    for (const q of s.qs) {
      if (!shown(q)) continue;
      if (A[q.v] !== undefined) keep[q.v] = A[q.v];
      if (A[q.v + "_other"]) keep[q.v + "_other"] = A[q.v + "_other"];
    }
    if (s === cur) break;
  }
  A = keep;
}

function finish() {
  prune();
  const end = new Date();
  const rec = { id: meta.id, status: "complete", start: meta.start, end: end.toISOString(),
    dur: Math.round((end - new Date(meta.start)) / 1000),
    lang: meta.lang, email: meta.email, answers: A, sent: false };
  const all = load(); all.push(rec); save(all);   // local copy first, so nothing is lost if sending fails
  meta.done = true;
  cur = null;
  renderEnd();
  deliver(rec);
}

function renderEnd() {
  app.innerHTML = `
  <div class="wrap end">
    ${cupSVG(lastLevel)}
    <h1>${tr("Thank you!")}</h1>
    <p class="lead" id="end-msg">${tr(STUDY.sheetUrl ? "Saving your answers…" : "Your answers are saved. 謝謝您的參與！")}</p>
    <button class="btn primary big" id="retry" type="button" hidden>${tr("Try again")}</button>
  </div>`;
  window.scrollTo(0, 0);
  fillCup(1);
}

/* --- sending to Google Sheets --- */
async function postSheet(body) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
  try {
    // text/plain keeps this a "simple" request, which Apps Script accepts without a CORS preflight
    const res = await fetch(STUDY.sheetUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                                              body: JSON.stringify(body), signal: ctl.signal });
    return await res.json();
  } finally { clearTimeout(timer); }
}

// "sent" | "duplicate" | "failed" | "local"
async function sendRecord(rec) {
  if (!STUDY.sheetUrl) return "local";
  try {
    const res = await postSheet({ action: "submit", columns: columns(), row: toRow(rec) });
    if (!res.ok && res.reason !== "duplicate") return "failed";
    // the sheet now holds it; keep answers as a backup, but not the email, on a possibly shared device
    const all = load(), r = all.find(x => x.id === rec.id);
    if (r) { r.sent = true; delete r.email; save(all); }
    return res.ok ? "sent" : "duplicate";
  } catch (e) { return "failed"; }
}

async function deliver(rec) {
  sending = true;
  let result = await sendRecord(rec);
  for (const pause of [2000, 5000]) {   // a busy moment usually clears within seconds
    if (result !== "failed") break;
    await new Promise(r => setTimeout(r, pause));
    result = await sendRecord(rec);
  }
  sending = false;
  const msg = document.getElementById("end-msg"), retry = document.getElementById("retry");
  if (!msg) return;   // already on another page
  const text = { sent: "Your answers are saved. 謝謝您的參與！", local: "Your answers are saved. 謝謝您的參與！",
                 duplicate: "This email has already been used to answer the survey.",
                 failed: "We couldn't send your answers. Please check your internet connection and try again." }[result];
  msg.textContent = tr(text);
  retry.hidden = result !== "failed";
  retry.onclick = () => { retry.hidden = true; msg.textContent = tr("Saving your answers…"); deliver(rec); };
}

// answers that could not be sent earlier on this device go out on the next visit
async function flushUnsent() {
  for (const r of load().filter(x => x.sent === false)) await sendRecord(r);
}

/* ===================== 5. CSV EXPORT ===================== */
function columns() {
  const cols = ["resp_id", "status", "start_time", "end_time", "duration_sec", "lang", "email"];
  SECTIONS.forEach(s => s.qs.forEach(q => {
    if (q.t === "multi") q.opts.forEach(([c]) => cols.push(`${q.v}_${c}`));
    else if (q.t === "grid") { q.rows.forEach(([k]) => cols.push(`${q.v}_${k}`)); if (q.construct) cols.push(`${q.v}_mean`); }
    else cols.push(q.v);
    if (otherCode(q) !== undefined) cols.push(q.v + "_other");
  }));
  cols.push("buys_mkt_minimal", "buys_mkt_mixed", "buys_mkt_heavy", "attn_pass");
  return cols;
}

function toRow(r) {
  const a = r.answers;
  const o = { resp_id: r.id, status: r.status, start_time: r.start, end_time: r.end, duration_sec: r.dur,
              lang: r.lang || "en", email: r.email || "" };
  SECTIONS.forEach(s => s.qs.forEach(q => {
    const v = a[q.v];
    if (q.t === "multi") q.opts.forEach(([c]) => { o[`${q.v}_${c}`] = Array.isArray(v) ? (v.includes(c) ? 1 : 0) : ""; });
    else if (q.t === "grid") {
      q.rows.forEach(([k]) => { o[`${q.v}_${k}`] = v && v[k] !== undefined ? v[k] : ""; });
      if (q.construct) {
        const items = q.rows.filter(([k]) => k !== "attn").map(([k]) => v && v[k]);
        // a number, not a "3.67" string, so a comma-decimal spreadsheet does not read it as text or a date
        o[`${q.v}_mean`] = items.every(x => typeof x === "number") ? Math.round(items.reduce((s2, x) => s2 + x, 0) / items.length * 100) / 100 : "";
      }
    }
    else o[q.v] = v === undefined ? "" : v;
    if (otherCode(q) !== undefined) o[q.v + "_other"] = a[q.v + "_other"] || "";
  }));
  ["minimal", "mixed", "heavy"].forEach(g => {
    o[`buys_mkt_${g}`] = Array.isArray(a.Q9_shops) ? (a.Q9_shops.some(c => MKT_GROUP[c] === g) ? 1 : 0) : "";
  });
  const at = a.X3 && a.X3.attn;
  o.attn_pass = at === undefined ? "" : (at === 2 ? 1 : 0);
  return o;
}

const cell = v => {
  v = String(v ?? "");
  if (/^[=+\-@]/.test(v)) v = "'" + v;   // typed text must not open as a formula in Excel
  return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
};

function exportCSV() {
  const all = load();
  if (!all.length) { alert("There are no saved responses on this device yet."); return; }
  const cols = columns();
  const lines = [cols.join(",")].concat(all.map(r => { const o = toRow(r); return cols.map(k => cell(o[k])).join(","); }));
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = `group5_bubbletea_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(link); link.click();
  setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 500);
}

/* ===================== 6. START ===================== */
const route = () => location.hash === "#staff" ? renderStaff() : renderWelcome();
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", e => { if (cur || sending) { e.preventDefault(); e.returnValue = ""; } });
route();
if (STUDY.sheetUrl) flushUnsent();
</script>
